name: Deploy to GitHub Pages

# Deploys the site whenever `main` changes:
#  - on every push to main (e.g. when you merge a pull request yourself),
#  - when the "Auto-merge Claude PRs" workflow starts it after merging
#    (merges made by a workflow don't create a push event for other workflows),
#  - or manually from the Actions tab.
# Requires Settings → Pages → Source: "GitHub Actions" (see README).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
